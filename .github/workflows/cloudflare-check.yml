name: Cloudflare authentication checks
on:
  push:
    paths: ['cloudflare/**', 'functions/**', 'tests/cloudflare-*.test.mjs', 'package.json', '.github/workflows/cloudflare-check.yml']
  pull_request:
    paths: ['cloudflare/**', 'functions/**', 'tests/cloudflare-*.test.mjs', 'package.json', '.github/workflows/cloudflare-check.yml']
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:cloudflare
      - run: npm run build:pages
